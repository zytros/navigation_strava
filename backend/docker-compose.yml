services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: veloroute-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    command: osrm-routed --algorithm mld /data/map.osrm

  elevation:
    build: .
    container_name: veloroute-elevation
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/dem:/datasets
